<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180" fill="none">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8F8F0"/>
      <stop offset="100%" stop-color="#D1F2DF"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C853"/>
      <stop offset="100%" stop-color="#008A3B"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </linearGradient>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2F5EA"/>
    </linearGradient>
  </defs>

  <!-- Ambient Backdrop Circles -->
  <circle cx="120" cy="90" r="76" fill="url(#bgGlow)"/>
  <circle cx="120" cy="90" r="62" fill="url(#circleGrad)" stroke="#B9E8CE" stroke-width="2"/>

  <!-- Left Float Element: Fare Coin -->
  <g transform="translate(42, 60)">
    <circle cx="16" cy="16" r="16" fill="url(#goldGrad)"/>
    <circle cx="16" cy="16" r="12" fill="#FFE082" stroke="#FF8F00" stroke-width="1.5"/>
    <text x="16" y="21" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#E65100" text-anchor="middle">₹</text>
  </g>

  <!-- Right Float Element: Distance Pin -->
  <g transform="translate(166, 56)">
    <circle cx="16" cy="16" r="16" fill="#E0F2FE"/>
    <path d="M16 6 C11 6 7 10 7 15 C7 21.5 16 28 16 28 C16 28 25 21.5 25 15 C25 10 21 6 16 6 Z" fill="#0284C7"/>
    <circle cx="16" cy="14" r="3.5" fill="#FFFFFF"/>
  </g>

  <!-- Central Shield Shadow -->
  <path d="M120 38 L154 54 C154 90 140 118 120 132 C100 118 86 90 86 54 Z" fill="#00A84D" opacity="0.18"/>

  <!-- Central Shield -->
  <path d="M120 34 L154 50 C154 86 140 114 120 128 C100 114 86 86 86 50 Z" 
        fill="url(#shieldGrad)" 
        stroke="#FFFFFF" 
        stroke-width="3.5"/>
  
  <!-- Inner Shield Accent -->
  <path d="M120 40 L148 54 C148 84 136 108 120 121 C104 108 92 84 92 54 Z" 
        fill="none" 
        stroke="#69F0AE" 
        stroke-width="1.5" 
        opacity="0.6"/>

  <!-- Sharp White Checkmark -->
  <path d="M106 80 L116 90 L135 68" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Sparkles -->
  <path d="M72 36 L74 42 L80 44 L74 46 L72 52 L70 46 L64 44 L70 42 Z" fill="#FFC107"/>
  <path d="M174 116 L175 120 L179 121 L175 122 L174 126 L173 122 L169 121 L173 120 Z" fill="#00C853"/>
  <circle cx="180" cy="40" r="3" fill="#FFD54F"/>
  <circle cx="58" cy="116" r="2.5" fill="#00C853"/>

  <!-- Base Badge / Auto Accept Indicator -->
  <g transform="translate(75, 142)">
    <rect x="0" y="0" width="90" height="24" rx="12" fill="#FFFFFF" stroke="#00A84D" stroke-width="1.5"/>
    <circle cx="14" cy="12" r="4" fill="#00C853"/>
    <text x="50" y="16" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#007934" text-anchor="middle">SnapRider</text>
  </g>
</svg>

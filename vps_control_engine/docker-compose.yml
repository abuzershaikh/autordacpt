version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: autoride-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-root_password_change_me}
      MYSQL_DATABASE: ${DB_NAME:-autoride_control_db}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autoride-vps-engine
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASS: ${DB_PASS:-root_password_change_me}
      DB_NAME: ${DB_NAME:-autoride_control_db}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-admin_secret_autoride_2026}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_autoride_enterprise_2026}
      FIREBASE_PROJECT_ID: autoride-accept
      FIREBASE_CLIENT_EMAIL: firebase-adminsdk-fbsvc@autoride-accept.iam.gserviceaccount.com
    ports:
      - "5000:5000"
    volumes:
      - ./config/serviceAccountKey.json:/usr/src/app/config/serviceAccountKey.json:ro

volumes:
  mysql_data:
    driver: local
